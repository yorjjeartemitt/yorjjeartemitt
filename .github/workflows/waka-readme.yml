name: Waka Readme
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  update-readme:
    name: WakaReadme
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.README_GITHUB }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_UPDATED_DATE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_TIMEZONE: "False"
          SHOW_PROFILE_VIEWS: "True"
          COMMIT_BY_ME: "True"
          LOCALE: "en"
          SECTION_NAME: "waka"
          SYMBOL_VERSION: "1"
          BAR_STYLE: "rounded"
          BAR_COLOR: "38bdae"
          BAR_TRACK_COLOR: "27272a"
          TEXT_PRIMARY_COLOR: "e4e4e7"
          TEXT_SECONDARY_COLOR: "a1a1aa"
